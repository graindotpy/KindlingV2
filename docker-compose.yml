name: kindling

services:
  kindling:
    image: kindling:local
    build: .
    container_name: kindling
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${KINDLING_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/kindling.db
      KINDLING_EMBEDDED_WORKER: "false"
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    user: "${KINDLING_UID:-1000}:${KINDLING_GID:-1000}"
    volumes:
      - ${KINDLING_DATA_DIR:-./data}:/app/data
      - ${KINDLING_BOOKS_DIR:-./watched-books}:/watched-books:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
